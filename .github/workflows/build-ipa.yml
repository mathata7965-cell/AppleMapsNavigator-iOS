name: Build Sideload-Ready IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-ipa:
    name: Compile iOS App & Package Sideload IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Build Release iOS App (Ad-Hoc Sideload Ready)
        run: |
          xcodebuild clean build \
            -project AppleMapsNavigator.xcodeproj \
            -target AppleMapsNavigator \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Ad-Hoc Sign & Package Payload into AppleMapsNavigator.ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/Release-iphoneos/AppleMapsNavigator.app build/ipa/Payload/
          codesign --force --deep --sign - build/ipa/Payload/AppleMapsNavigator.app
          codesign --verify --deep --strict build/ipa/Payload/AppleMapsNavigator.app || true
          (cd build/ipa && zip -r ../../AppleMapsNavigator.ipa Payload)
          ls -lh AppleMapsNavigator.ipa

      - name: Upload AppleMapsNavigator.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleMapsNavigator-ipa
          path: AppleMapsNavigator.ipa
          retention-days: 30
